{% load i18n %}
<div
  id="{{ element_id }}"
  class="multilingual-text"
  data-course-id="{{ course_id }}"
>
  {% if translations %}
    <div class="multilingual-text__control">
      <span id="{{ element_id }}-language-label" class="multilingual-text__label">
        {% trans "Language" %}:
      </span>
      <div class="multilingual-text__dropdown">
        <button
          type="button"
          class="multilingual-text__trigger"
          aria-expanded="false"
          aria-haspopup="listbox"
          aria-labelledby="{{ element_id }}-language-label {{ element_id }}-language-value"
          aria-controls="{{ element_id }}-language-options"
        >
          <span id="{{ element_id }}-language-value" class="multilingual-text__value">
            {{ translations.0.label }}
          </span>
          <span class="multilingual-text__chevron" aria-hidden="true"></span>
        </button>
        <div
          id="{{ element_id }}-language-options"
          class="multilingual-text__options"
          role="listbox"
          aria-labelledby="{{ element_id }}-language-label"
          hidden
        >
          {% for translation in translations %}
            <button
              type="button"
              class="multilingual-text__option{% if forloop.first %} multilingual-text__option--selected{% endif %}"
              role="option"
              data-language-option="{{ translation.code }}"
              aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"
              tabindex="-1"
            >{{ translation.label }}</button>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="multilingual-text__contents">
      {% for translation in translations %}
        <div
          class="multilingual-text__content"
          data-language="{{ translation.code }}"
          lang="{{ translation.code }}"
          dir="auto"
          {% if not forloop.first %}hidden{% endif %}
        >{{ translation.content|safe }}</div>
      {% endfor %}
    </div>
  {% else %}
    <p class="multilingual-text__unavailable" role="status">
      {% trans "This content is not available in any language." %}
    </p>
  {% endif %}
</div>
